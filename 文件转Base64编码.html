<!-- 项目名称: 文件转Base64编码 -->
<!-- 项目创建日期: 2025年10月01日 21时49分07秒 -->
<!-- 项目作者: lhc -->
<!-- 项目版本: V1.0.0 -->

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件转Base64工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    
    <!-- Tailwind 配置 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3B82F6',
                        secondary: '#10B981',
                        neutral: '#1F2937',
                        light: '#F3F4F6'
                    },
                    fontFamily: {
                        inter: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .drop-active {
                @apply border-primary bg-primary/10;
            }
            .transition-all-300 {
                @apply transition-all duration-300 ease-in-out;
            }
        }
    </style>
</head>
<body class="font-inter bg-gray-50 min-h-screen flex flex-col">
    <!-- 顶部导航 -->
    <header class="bg-white shadow-sm py-4 px-6">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold text-neutral flex items-center">
                <i class="fa fa-exchange text-primary mr-2"></i>
                文件转Base64工具
            </h1>
            <div class="text-gray-500 text-sm">
                简单高效的文件编码工具
            </div>
        </div>
    </header>

    <!-- 主内容区 -->
    <main class="flex-grow container mx-auto p-4 md:p-6 lg:p-8">
        <div class="max-w-5xl mx-auto">
            <!-- 说明区域 -->
            <div class="mb-8 text-center">
                <h2 class="text-xl md:text-2xl font-semibold text-neutral mb-2">拖放文件到下方区域进行转换</h2>
                <p class="text-gray-600">支持图片、文本等多种文件类型，转换后可复制Base64编码</p>
            </div>
            
            <!-- 拖放区域 -->
            <div id="dropArea" class="border-2 border-dashed border-gray-300 rounded-xl p-8 md:p-12 text-center transition-all-300 mb-8 bg-white shadow-sm hover:shadow-md">
                <div class="flex flex-col items-center justify-center">
                    <i class="fa fa-cloud-upload text-5xl text-gray-400 mb-4"></i>
                    <p class="text-gray-600 mb-4">将文件拖放到此处，或</p>
                    <label class="bg-primary hover:bg-primary/90 text-white px-6 py-3 rounded-lg cursor-pointer transition-all-300 font-medium shadow-sm hover:shadow">
                        <i class="fa fa-file-o mr-2"></i>选择文件
                        <input type="file" id="fileInput" class="hidden" />
                    </label>
                    <p class="text-xs text-gray-500 mt-4">支持所有文件类型，大文件可能需要更长时间</p>
                </div>
            </div>
            
            <!-- 文件信息区域 -->
            <div id="fileInfo" class="hidden mb-6 bg-white p-4 rounded-lg shadow-sm border border-gray-100">
                <h3 class="font-semibold text-neutral mb-2 flex items-center">
                    <i class="fa fa-file-text-o text-primary mr-2"></i>文件信息
                </h3>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-sm">
                    <div>
                        <span class="text-gray-500">文件名：</span>
                        <span id="fileName" class="font-medium"></span>
                    </div>
                    <div>
                        <span class="text-gray-500">文件大小：</span>
                        <span id="fileSize" class="font-medium"></span>
                    </div>
                    <div>
                        <span class="text-gray-500">MIME类型：</span>
                        <span id="fileType" class="font-medium"></span>
                    </div>
                </div>
            </div>
            
            <!-- 转换结果区域 -->
            <div id="resultArea" class="hidden">
                <div class="flex justify-between items-center mb-3">
                    <h3 class="font-semibold text-neutral flex items-center">
                        <i class="fa fa-code text-primary mr-2"></i>Base64编码结果
                    </h3>
                    <button id="copyBtn" class="bg-secondary hover:bg-secondary/90 text-white px-4 py-2 rounded-lg text-sm transition-all-300 flex items-center">
                        <i class="fa fa-copy mr-1"></i>复制编码
                    </button>
                </div>
                <div class="relative">
                    <textarea id="base64Result" class="w-full h-48 md:h-64 p-4 border border-gray-300 rounded-lg bg-white font-mono text-sm focus:ring-2 focus:ring-primary focus:border-primary outline-none resize-none" readonly></textarea>
                    <div id="copyNotification" class="hidden absolute top-3 right-3 bg-green-500 text-white text-xs px-3 py-1 rounded-full shadow-md">
                        已复制！
                    </div>
                </div>
                <p class="text-xs text-gray-500 mt-2">提示：Base64编码通常比原始文件大33%左右</p>
            </div>
            
            <!-- 加载状态 -->
            <div id="loadingArea" class="hidden text-center py-8">
                <div class="inline-block animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-primary mb-4"></div>
                <p class="text-gray-600">正在处理文件，请稍候...</p>
            </div>
            
            <!-- 错误提示 -->
            <div id="errorArea" class="hidden bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg mb-6">
                <p class="flex items-center">
                    <i class="fa fa-exclamation-circle mr-2"></i>
                    <span id="errorMessage"></span>
                </p>
            </div>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="bg-white border-t border-gray-200 py-4 px-6">
        <div class="container mx-auto text-center text-gray-500 text-sm">
            <p>Base64转换工具 &copy; 2023 - 所有转换均在本地完成，不会上传您的文件</p>
        </div>
    </footer>

    <script>
        // 获取DOM元素
        const dropArea = document.getElementById('dropArea');
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const fileSize = document.getElementById('fileSize');
        const fileType = document.getElementById('fileType');
        const resultArea = document.getElementById('resultArea');
        const base64Result = document.getElementById('base64Result');
        const copyBtn = document.getElementById('copyBtn');
        const copyNotification = document.getElementById('copyNotification');
        const loadingArea = document.getElementById('loadingArea');
        const errorArea = document.getElementById('errorArea');
        const errorMessage = document.getElementById('errorMessage');

        // 拖放事件处理
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropArea.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropArea.addEventListener(eventName, highlight, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropArea.addEventListener(eventName, unhighlight, false);
        });

        function highlight() {
            dropArea.classList.add('drop-active');
        }

        function unhighlight() {
            dropArea.classList.remove('drop-active');
        }

        // 处理文件拖放
        dropArea.addEventListener('drop', handleDrop, false);

        function handleDrop(e) {
            const dt = e.dataTransfer;
            const files = dt.files;
            
            if (files.length) {
                handleFiles(files[0]);
            }
        }

        // 处理文件选择
        fileInput.addEventListener('change', function() {
            if (this.files.length) {
                handleFiles(this.files[0]);
            }
        });

        // 点击拖放区域也能触发文件选择
        dropArea.addEventListener('click', function() {
            fileInput.click();
        });

        // 处理文件
        function handleFiles(file) {
            // 显示加载状态
            showLoading();
            hideError();
            
            // 显示文件信息
            showFileInfo(file);
            
            // 转换文件为Base64
            const reader = new FileReader();
            
            reader.onload = function(e) {
                // 隐藏加载状态
                hideLoading();
                
                // 显示结果
                base64Result.value = e.target.result;
                resultArea.classList.remove('hidden');
                
                // 自动滚动到结果区域
                resultArea.scrollIntoView({ behavior: 'smooth', block: 'start' });
            };
            
            reader.onerror = function() {
                hideLoading();
                showError('文件读取失败，请尝试其他文件');
            };
            
            // 读取文件并转换为Base64
            reader.readAsDataURL(file);
        }

        // 显示文件信息
        function showFileInfo(file) {
            fileName.textContent = file.name;
            fileSize.textContent = formatFileSize(file.size);
            fileType.textContent = file.type || '未知类型';
            fileInfo.classList.remove('hidden');
        }

        // 格式化文件大小
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // 复制功能
        copyBtn.addEventListener('click', function() {
            base64Result.select();
            document.execCommand('copy');
            
            // 显示复制成功提示
            copyNotification.classList.remove('hidden');
            setTimeout(() => {
                copyNotification.classList.add('hidden');
            }, 2000);
        });

        // 显示加载状态
        function showLoading() {
            loadingArea.classList.remove('hidden');
            resultArea.classList.add('hidden');
        }

        // 隐藏加载状态
        function hideLoading() {
            loadingArea.classList.add('hidden');
        }

        // 显示错误信息
        function showError(message) {
            errorMessage.textContent = message;
            errorArea.classList.remove('hidden');
        }

        // 隐藏错误信息
        function hideError() {
            errorArea.classList.add('hidden');
        }
    </script>
</body>
</html>
