<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片对比组件（无变形显示）</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: #f5f5f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background-color: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            padding: 25px;
            margin-top: 20px;
        }

        .title {
            text-align: center;
            font-size: 24px;
            color: #333;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .subtitle {
            text-align: center;
            font-size: 14px;
            color: #666;
            margin-bottom: 20px;
        }

        /* 对比容器 - 关键：使用相对定位，让两张图片完全重叠 */
        .comparison-container {
            position: relative;
            width: 100%;
            overflow: hidden;
            border-radius: 8px;
            cursor: ew-resize;
            border: 2px dashed #ddd;
            min-height: 300px;
        }

        /* 拖入反馈样式 */
        .comparison-container.drag-over {
            border-color: #2c3e50;
            background-color: rgba(44, 62, 80, 0.05);
        }

        /* 占位提示 */
        .placeholder {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #999;
            font-size: 16px;
            z-index: 4;
        }

        .placeholder-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        /* 顶部图片容器 - 关键：通过clip-path控制显示区域 */
        .top-image-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            /* 初始显示左半部分 */
            clip-path: polygon(0 0, 50% 0, 50% 100%, 0 100%);
        }

        /* 底部图片容器 */
        .bottom-image-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* 图片样式 - 关键：保持原始比例，居中显示 */
        .comparison-image {
            width: 100%;
            height: 100%;
            object-fit: contain; /* 保持比例，完整显示图片 */
            display: block;
            background-color: #f9f9f9;
        }

        /* 滑块样式 */
        .comparison-slider {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 4px;
            background-color: #fff;
            cursor: ew-resize;
            z-index: 2;
            transform: translateX(-50%);
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.3);
        }

        /* 滑块手柄 */
        .comparison-handle {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 40px;
            height: 40px;
            background-color: #2c3e50;
            border-radius: 50%;
            cursor: ew-resize;
            z-index: 3;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .comparison-handle::before {
            content: "⟷";
            color: #fff;
            font-size: 18px;
        }

        /* 图片标签 */
        .image-label {
            position: absolute;
            top: 20px;
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 500;
            color: #fff;
            z-index: 2;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .label-top {
            left: 20px;
        }

        .label-bottom {
            right: 20px;
        }

        /* 响应式调整 */
        @media (max-width: 768px) {
            .title {
                font-size: 20px;
            }

            .image-label {
                font-size: 14px;
                padding: 6px 12px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 15px;
            }

            .placeholder {
                font-size: 14px;
            }

            .comparison-handle {
                width: 30px;
                height: 30px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">图片对比组件（无变形显示）</h1>
        <p class="subtitle">拖入两张图片，拖动滑块改变顶部图片显示区域（图片不会变形）</p>
        
        <div class="comparison-container" id="comparisonContainer">
            <!-- 占位提示 -->
            <div class="placeholder" id="placeholder">
                <div class="placeholder-icon">📁</div>
                <div>将本地图片拖入此区域</div>
                <div style="margin-top: 8px; font-size: 12px;">第一张为顶部图，第二张为底部图</div>
            </div>

            <!-- 顶部图片容器 - 通过clip-path控制显示区域 -->
            <div class="top-image-container" id="topImageContainer">
                <img src="" alt="顶部图片" class="comparison-image" id="topImage">
                <div class="image-label label-top">顶部图</div>
            </div>

            <!-- 底部图片容器 -->
            <div class="bottom-image-container">
                <img src="" alt="底部图片" class="comparison-image" id="bottomImage">
                <div class="image-label label-bottom">底部图</div>
            </div>

            <!-- 滑块 -->
            <div class="comparison-slider" id="comparisonSlider">
                <div class="comparison-handle"></div>
            </div>
        </div>
    </div>

    <script>
        // 获取DOM元素
        const comparisonContainer = document.getElementById('comparisonContainer');
        const topImageContainer = document.getElementById('topImageContainer');
        const comparisonSlider = document.getElementById('comparisonSlider');
        const topImage = document.getElementById('topImage');
        const bottomImage = document.getElementById('bottomImage');
        const placeholder = document.getElementById('placeholder');
        
        // 初始化变量
        let isDragging = false;
        let containerWidth = 0;
        let imageCount = 0;

        // 计算容器宽度并设置初始状态
        function initContainerSize() {
            containerWidth = comparisonContainer.offsetWidth;
            // 设置初始裁剪路径（显示左半部分）
            updateClipPath(50);
        }

        // --------------------------
        // 核心：通过clip-path改变显示区域
        // 不改变图片宽度，而是裁剪显示区域，避免变形
        // --------------------------
        function updateClipPath(percent) {
            // 使用多边形裁剪路径定义顶部图片的显示区域
            // 当percent=50时，显示左半部分；percent=100时，显示全部；percent=0时，完全隐藏
            topImageContainer.style.clipPath = `polygon(0 0, ${percent}% 0, ${percent}% 100%, 0 100%)`;
            // 同步更新滑块位置
            comparisonSlider.style.left = `${percent}%`;
        }

        // --------------------------
        // 拖入图片功能
        // --------------------------
        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            comparisonContainer.addEventListener(eventName, preventDefaults, false);
        });

        function highlight() {
            comparisonContainer.classList.add('drag-over');
        }

        function unhighlight() {
            comparisonContainer.classList.remove('drag-over');
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            comparisonContainer.addEventListener(eventName, highlight, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            comparisonContainer.addEventListener(eventName, unhighlight, false);
        });

        comparisonContainer.addEventListener('drop', handleDrop, false);

        function handleDrop(e) {
            const dt = e.dataTransfer;
            const files = dt.files;

            if (files && files.length > 0) {
                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    if (file.type.startsWith('image/')) {
                        handleImageFile(file);
                        if (imageCount >= 2) break;
                    }
                }
            }
        }

        function handleImageFile(file) {
            const reader = new FileReader();

            reader.onload = function(e) {
                const imgSrc = e.target.result;

                // 加载图片前先获取尺寸，确保容器适应图片
                const tempImg = new Image();
                tempImg.onload = function() {
                    // 根据第一张图片设置容器高度，保持比例
                    if (imageCount === 0) {
                        // 计算合适的容器高度，确保图片能完整显示
                        const containerHeight = Math.min(
                            window.innerHeight * 0.7, // 不超过窗口高度的70%
                            (containerWidth / tempImg.width) * tempImg.height // 按比例计算
                        );
                        comparisonContainer.style.height = `${containerHeight}px`;
                    }

                    // 设置图片源
                    if (imageCount === 0) {
                        topImage.src = imgSrc;
                    } else if (imageCount === 1) {
                        bottomImage.src = imgSrc;
                        placeholder.style.display = 'none';
                        comparisonContainer.style.border = 'none';
                    }

                    imageCount++;
                };

                tempImg.src = imgSrc;
            };

            reader.readAsDataURL(file);
        }

        // --------------------------
        // 滑块拖动功能
        // --------------------------
        function startDrag(e) {
            isDragging = true;
            document.addEventListener('mousemove', dragSlider);
            document.addEventListener('touchmove', dragSlider);
            document.addEventListener('mouseup', endDrag);
            document.addEventListener('touchend', endDrag);
            e.preventDefault();
        }

        function dragSlider(e) {
            if (!isDragging) return;

            let clientX = e.type === 'touchmove' ? e.touches[0].clientX : e.clientX;
            const containerRect = comparisonContainer.getBoundingClientRect();
            
            // 计算滑块位置百分比
            let positionPercent = ((clientX - containerRect.left) / containerRect.width) * 100;
            positionPercent = Math.max(0, Math.min(positionPercent, 100)); // 限制在0-100%之间
            
            // 更新裁剪区域
            updateClipPath(positionPercent);
        }

        function endDrag() {
            isDragging = false;
            document.removeEventListener('mousemove', dragSlider);
            document.removeEventListener('touchmove', dragSlider);
        }

        // --------------------------
        // 初始化
        // --------------------------
        function init() {
            // 初始化容器尺寸
            initContainerSize();
            
            // 监听窗口大小变化，重新计算容器尺寸
            window.addEventListener('resize', () => {
                initContainerSize();
            });
            
            // 滑块事件监听
            comparisonSlider.addEventListener('mousedown', startDrag);
            comparisonSlider.addEventListener('touchstart', startDrag);
            
            // 点击容器调整滑块位置
            comparisonContainer.addEventListener('click', (e) => {
                if (!isDragging) dragSlider(e);
            });

            // 加载示例图片
            loadExampleImages();
        }

        // 加载示例图片
        function loadExampleImages() {
            topImage.src = 'https://picsum.photos/id/1015/800/600';
            bottomImage.src = 'https://picsum.photos/id/1018/800/600';
            imageCount = 2;
            placeholder.style.display = 'none';
            comparisonContainer.style.border = 'none';
            
            // 确保图片加载后设置容器高度
            topImage.onload = function() {
                initContainerSize();
            };
        }

        // 页面加载完成后初始化
        window.addEventListener('load', init);
    </script>
</body>
</html>
