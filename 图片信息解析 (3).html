<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>图片元数据查看器（高德地图版）</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font Awesome -->
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet" />

  <!-- 高德地图 JS API -->
  <script src="https://webapi.amap.com/maps?v=1.4.15&key=24a7a55e32f2d465e3d8a09b0d5d6"></script>

  <!-- exifr.js：读取 EXIF 信息 -->
  <script src="https://cdn.jsdelivr.net/npm/exifr/dist/full.umd.js"></script>

  <style>
    .drop-zone {
      border: 2px dashed #23b7e5;
      border-radius: 0.75rem;
      transition: background-color 0.3s;
    }
    .drop-zone.dragover {
      background-color: #e6f7ff;
    }
    #map {
      width: 100%;
      height: 400px;
      border-radius: 0.75rem;
      overflow: hidden;
    }
    .amap-logo, .amap-copyright {
      display: none !important;
    }
  </style>
</head>

<body class="bg-gray-100 text-gray-800">
  <header class="bg-white shadow-sm py-4 mb-6">
    <h1 class="text-center text-2xl font-bold text-primary">
      <i class="fa fa-picture-o text-primary mr-2"></i>图片元数据查看器（高德地图）
    </h1>
  </header>

  <main class="container mx-auto px-4">
    <!-- 上传区域 -->
    <div id="drop-zone" class="drop-zone bg-white p-8 mb-6 text-center cursor-pointer">
      <i class="fa fa-upload text-primary text-4xl mb-2"></i>
      <p class="text-gray-600">拖拽图片到此处，或点击选择文件</p>
      <input type="file" id="file-input" accept="image/*" class="hidden" />
    </div>

    <!-- 图片和元数据显示区 -->
    <div id="result" class="hidden grid md:grid-cols-2 gap-6">
      <!-- 左侧图片 -->
      <div class="bg-white p-4 rounded-xl shadow">
        <h2 class="text-lg font-semibold mb-2 text-primary"><i class="fa fa-image mr-2"></i>预览</h2>
        <img id="preview" src="" alt="预览" class="rounded-lg max-h-[400px] mx-auto" />
      </div>

      <!-- 右侧信息 -->
      <div class="bg-white p-4 rounded-xl shadow">
        <h2 class="text-lg font-semibold mb-2 text-primary"><i class="fa fa-info-circle mr-2"></i>图片信息</h2>
        <div id="info" class="text-sm space-y-1 mb-4 text-gray-700"></div>
        <h2 class="text-lg font-semibold mb-2 text-primary"><i class="fa fa-map-marker mr-2"></i>拍摄位置</h2>
        <div id="map" class="bg-gray-50"></div>
        <p id="map-status" class="text-gray-500 text-center text-sm mt-2">等待图片加载...</p>
      </div>
    </div>
  </main>

  <footer class="text-center text-gray-500 text-sm mt-6 mb-4">
    © 2025 图片元数据查看器 | 基于高德地图
  </footer>

  <script>
    const dropZone = document.getElementById("drop-zone");
    const fileInput = document.getElementById("file-input");
    const result = document.getElementById("result");
    const preview = document.getElementById("preview");
    const infoDiv = document.getElementById("info");
    const mapStatus = document.getElementById("map-status");

    let map, marker;

    // 拖拽上传
    dropZone.addEventListener("click", () => fileInput.click());
    dropZone.addEventListener("dragover", (e) => {
      e.preventDefault();
      dropZone.classList.add("dragover");
    });
    dropZone.addEventListener("dragleave", () => dropZone.classList.remove("dragover"));
    dropZone.addEventListener("drop", (e) => {
      e.preventDefault();
      dropZone.classList.remove("dragover");
      handleFiles(e.dataTransfer.files);
    });
    fileInput.addEventListener("change", (e) => handleFiles(e.target.files));

    // 处理文件
    async function handleFiles(files) {
      const file = files[0];
      if (!file) return;

      // 显示结果区
      result.classList.remove("hidden");
      preview.src = URL.createObjectURL(file);
      infoDiv.innerHTML = "";
      mapStatus.textContent = "正在读取 EXIF 元数据...";

      try {
        const exif = await exifr.parse(file);
        if (!exif) {
          mapStatus.textContent = "未读取到 EXIF 信息。";
          return;
        }

        // 显示主要信息
        infoDiv.innerHTML = `
          <p><b>文件名：</b>${file.name}</p>
          <p><b>拍摄设备：</b>${exif.Make || '-'} ${exif.Model || '-'}</p>
          <p><b>拍摄时间：</b>${exif.DateTimeOriginal || '-'}</p>
          <p><b>分辨率：</b>${exif.ExifImageWidth || '?'} × ${exif.ExifImageHeight || '?'}</p>
        `;

        if (exif.latitude && exif.longitude) {
          const lat = exif.latitude;
          const lng = exif.longitude;
          renderMap(lat, lng);
          mapStatus.innerHTML = `<span class="text-green-600"><i class="fa fa-check-circle mr-1"></i>已定位到拍摄地点</span>`;
        } else {
          mapStatus.innerHTML = `<span class="text-gray-500">未检测到地理位置信息</span>`;
          document.getElementById("map").innerHTML = "";
        }
      } catch (err) {
        console.error(err);
        mapStatus.textContent = "读取 EXIF 失败。";
      }
    }

    // 渲染高德地图
    function renderMap(lat, lng) {
      if (!window.AMap) {
        mapStatus.textContent = "高德地图加载失败。";
        return;
      }

      // 初始化地图
      if (!map) {
        map = new AMap.Map("map", {
          zoom: 14,
          center: [lng, lat],
          resizeEnable: true,
        });
      } else {
        map.setCenter([lng, lat]);
      }

      // 清除旧标记
      if (marker) map.remove(marker);

      // 添加标记
      marker = new AMap.Marker({
        position: [lng, lat],
        title: "拍摄位置",
        icon: new AMap.Icon({
          size: new AMap.Size(32, 32),
          image: "https://a.amap.com/jsapi_demos/static/demo-center/icons/poi-marker-default.png",
          imageSize: new AMap.Size(32, 32),
        }),
      });
      marker.setMap(map);

      const infoWindow = new AMap.InfoWindow({
        content: `<div style="padding:8px;">
                    <b>拍摄坐标</b><br>
                    纬度：${lat.toFixed(6)}<br>
                    经度：${lng.toFixed(6)}
                  </div>`,
        offset: new AMap.Pixel(0, -30),
      });

      marker.on("click", () => infoWindow.open(map, marker.getPosition()));
      infoWindow.open(map, marker.getPosition());
    }
  </script>
</body>
</html>
